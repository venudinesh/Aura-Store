<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Site search | 5play</title>
</head>
<body>
<section class="nx-stack">
	<h1>Search the site</h1>
	<form name="fullsearch" id="fullsearch" action="" method="get">
		<input type="hidden" name="do" id="do" value="search">
		<input type="hidden" name="subaction" id="subaction" value="search">
		<input type="hidden" name="search_start" id="search_start" value="1">
		<input type="text" name="story" id="searchinput" value="spotify">
	</form>

	<div class="nx-alert" role="status"><p class="nx-alert__text">Your search returned 2 results (Query results 1 - 2) :</p></div>

	<article class="nx-app nx-app--row">
		<div class="nx-appicon"><img src="https://cdn.5play.org/posts/2024-05/spotify.webp" alt="" width="200" height="200" loading="lazy"></div>
		<div class="nx-app__badges"><span class="nx-badge nx-badge--mod">Mod</span></div>
		<div class="nx-app__body">
			<h3 class="nx-app__title nx-clamp-2"><a href="https://5play.org/en/2304-spotify-music.html">Spotify</a></h3>
			<p class="nx-app__meta"><span class="nx-app__ver" title="v9.0.30">v9.0.30</span><span>Music &amp; Audio</span></p>
		</div>
	</article>

	<article class="nx-app nx-app--row">
		<div class="nx-appicon"><img src="https://cdn.5play.org/posts/2024-09/spotify-lite.webp" alt=""></div>
		<div class="nx-app__body">
			<h3 class="nx-app__title nx-clamp-2"><a href="https://5play.org/en/9841-spotify-lite.html">Spotify Lite</a></h3>
			<p class="nx-app__meta"><span class="nx-app__ver" title="v1.9.0">v1.9.0</span></p>
		</div>
	</article>

	<section class="nx-section" aria-labelledby="nx-h-recommend">
		<h2 class="nx-section__title" id="nx-h-recommend">Recommend</h2>
		<article class="nx-app">
			<div class="nx-appicon"><img src="https://cdn.5play.org/posts/2023-11/minecraft.webp" alt=""></div>
			<div class="nx-app__body">
				<h3 class="nx-app__title nx-clamp-2"><a href="https://5play.org/en/24-minecraft.html">Minecraft</a></h3>
			</div>
		</article>
	</section>
</section>
</body>
</html>
